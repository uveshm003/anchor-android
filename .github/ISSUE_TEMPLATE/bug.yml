name: Bug report
description: Something doesn't work as expected.
title: "fix: "
labels: ["type:bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
        3. 
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: input
    id: device
    attributes:
      label: Device and Android version
      placeholder: "Pixel 9, Android 17"
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Anchor version
      description: Settings → About, or the release tag.
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options: ["Modes", "Anchors (NFC/QR)", "Blocking", "Automatic triggers", "Quiet actions", "Strict mode", "Insights", "Widget / tile / shortcuts", "Onboarding / permissions", "Other"]
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: "`adb logcat` excerpts or screenshots. Remove anything personal."
      render: text
